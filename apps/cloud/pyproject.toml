[project]
name = "cabin-cloud"
version = "0.2.0"
description = "CabinPilot 云端：用例库、测试代码、任务池、判定、登录与看板（独立部署）"
requires-python = ">=3.12"
dependencies = [
    "cabin-common",
    "anthropic>=2.3.0",
    "cryptography>=42",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "sherpa-onnx>=2.0.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "pillow>=10.0.0",
]

[project.scripts]
cabin-cloud = "cabin_cloud.main:run"

[tool.uv.sources]
cabin-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cabin_cloud"]
